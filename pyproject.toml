[project]
name = "cascadesimulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kbaltakys", email = "kbaltakys@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4.2",
]

[project.scripts]
cascadesimulator = "cascadesimulator:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
